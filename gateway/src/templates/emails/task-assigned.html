<h2 style="color: #1f2937; font-size: 20px; font-weight: 600; margin: 0 0 16px;" class="text-primary">
  New Task Assigned
</h2>

<p style="color: #4b5563; font-size: 16px; line-height: 24px; margin: 0 0 24px;" class="text-secondary">
  You have been assigned a new task that requires your attention.
</p>

<!-- Task Details Card -->
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 24px;">
  <tr>
    <td style="padding: 20px;">
      <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
          <td style="padding-bottom: 12px;">
            <span style="color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Task</span>
          </td>
        </tr>
        <tr>
          <td>
            <span style="color: #1f2937; font-size: 18px; font-weight: 600;">{{taskTitle}}</span>
          </td>
        </tr>
        <tr>
          <td style="padding-top: 16px; padding-bottom: 8px;">
            <span style="color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Task ID</span>
          </td>
        </tr>
        <tr>
          <td>
            <span style="color: #4b5563; font-size: 14px; font-family: 'SF Mono', Monaco, 'Andale Mono', monospace;">#{{taskId}}</span>
          </td>
        </tr>
        {{#hasDueDate}}
        <tr>
          <td style="padding-top: 16px; padding-bottom: 8px;">
            <span style="color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Due Date</span>
          </td>
        </tr>
        <tr>
          <td>
            <div style="display: inline-flex; align-items: center; gap: 8px;">
              <span style="color: #dc2626; font-size: 16px;">&#128197;</span>
              <span style="color: #dc2626; font-size: 14px; font-weight: 500;">{{dueDate}}</span>
            </div>
          </td>
        </tr>
        {{/hasDueDate}}
      </table>
    </td>
  </tr>
</table>

<!-- CTA Button -->
<table border="0" cellpadding="0" cellspacing="0" width="100%">
  <tr>
    <td align="center">
      <table border="0" cellpadding="0" cellspacing="0">
        <tr>
          <td style="background-color: #2563eb; border-radius: 6px;">
            <a href="{{taskLink}}" class="btn-primary" style="display: inline-block; padding: 14px 32px; color: #ffffff; text-decoration: none; font-weight: 500; font-size: 16px;">
              View Task
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<p style="color: #6b7280; font-size: 14px; line-height: 22px; margin: 24px 0 0; text-align: center;" class="text-muted">
  Or copy and paste this link into your browser:<br>
  <a href="{{taskLink}}" style="color: #2563eb; text-decoration: none; word-break: break-all;">{{taskLink}}</a>
</p>
