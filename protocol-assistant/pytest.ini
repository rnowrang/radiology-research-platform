[pytest]
# Pytest configuration for Protocol Assistant

# Test paths
testpaths = tests

# Python files pattern
python_files = test_*.py *_test.py

# Python classes pattern
python_classes = Test*

# Python functions pattern
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (skipped by default)
    llm: Tests that require LLM API access

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (when using pytest-cov)
addopts =
    -v
    --strict-markers
    --tb=short

# Timeout for tests (requires pytest-timeout)
timeout = 30
